name: Cakra Langit Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: Backend install
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt

      - name: Backend compile
        run: python -m compileall -q backend

      - name: Authentication end-to-end smoke test
        env:
          DATABASE_URL: sqlite:////tmp/cakra-langit-smoke.db
          JWT_SECRET_KEY: ci-only-test-secret
          PYTHONPATH: backend
          API_URL: http://127.0.0.1:18000
        run: |
          alembic upgrade head
          python -c "import sys; sys.path.insert(0, 'backend'); import server, uvicorn; uvicorn.run(server.app, host='127.0.0.1', port=18000)" >/tmp/cakra-langit-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT

          python - <<'PY'
          import os
          import time
          import urllib.request

          url = os.environ['API_URL'] + '/api/health'
          for _ in range(30):
              try:
                  urllib.request.urlopen(url, timeout=1)
                  break
              except Exception:
                  time.sleep(1)
          else:
              raise SystemExit('Server did not become ready')
          PY

          curl -fsS "$API_URL/api/health"

          STATUS=$(curl -s -o /tmp/unauthorized.json -w '%{http_code}' "$API_URL/api/almanac?city=Bandung")
          test "$STATUS" = "401"

          EMAIL="smoke-${GITHUB_RUN_ID}@example.com"
          PASSWORD="Smoke${GITHUB_RUN_ID}!Aa9"

          REGISTER=$(curl -fsS -X POST "$API_URL/api/auth/register" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"display_name\":\"CI Smoke\"}")

          REGISTER_TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$REGISTER")
          test -n "$REGISTER_TOKEN"

          LOGIN=$(curl -fsS -X POST "$API_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}")

          TOKEN=$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$LOGIN")
          test -n "$TOKEN"

          curl -fsS "$API_URL/api/almanac?city=Bandung" \
            -H "Authorization: Bearer $TOKEN" >/tmp/almanac.json

          python - <<'PY'
          import json
          with open('/tmp/almanac.json') as fh:
              data = json.load(fh)
          required = {'location', 'date_info', 'natural', 'calendars', 'schedule'}
          missing = required.difference(data)
          if missing:
              raise SystemExit(f'Missing almanac fields: {sorted(missing)}')
          PY
