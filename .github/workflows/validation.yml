name: Cakra Langit Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: Backend install
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt && pip install httpx

      - name: Backend compile
        run: python -m compileall -q backend

      - name: Authentication end-to-end smoke test
        env:
          DATABASE_URL: sqlite:////tmp/cakra-langit-smoke.db
          JWT_SECRET_KEY: ci-only-test-secret
          PYTHONPATH: backend
        run: |
          alembic upgrade head
          python - <<'PY'
          import asyncio
          import json
          import sys

          import httpx

          sys.path.insert(0, 'backend')
          import server

          async def main():
              transport = httpx.ASGITransport(app=server.app)
              async with httpx.AsyncClient(
                  transport=transport,
                  base_url='http://testserver',
              ) as client:
                  health = await client.get('/api/health')
                  assert health.status_code == 200, health.text

                  public_hijri = await client.get(
                      '/api/hijri?year=2026&month=9&day=6'
                  )
                  assert public_hijri.status_code == 200, public_hijri.text

                  unauthorized = await client.get('/api/bazi?year=1990&month=1&day=1')
                  assert unauthorized.status_code == 401, unauthorized.text

                  email = 'smoke@example.com'
                  password = 'SmokeTest123!'

                  register = await client.post(
                      '/api/auth/register',
                      json={
                          'email': email,
                          'password': password,
                          'display_name': 'CI Smoke',
                      },
                  )
                  assert register.status_code == 201, register.text
                  register_payload = register.json()
                  assert register_payload['access_token']

                  login = await client.post(
                      '/api/auth/login',
                      json={'email': email, 'password': password},
                  )
                  assert login.status_code == 200, login.text
                  token = login.json()['access_token']
                  assert token

                  me = await client.get(
                      '/api/auth/me',
                      headers={'Authorization': f'Bearer {token}'},
                  )
                  assert me.status_code == 200, me.text
                  assert me.json()['email'] == email

                  bazi = await client.get(
                      '/api/bazi?year=1990&month=1&day=1',
                      headers={'Authorization': f'Bearer {token}'},
                  )
                  assert bazi.status_code in (200, 400), bazi.text

              print(json.dumps({'status': 'auth-e2e-pass'}))

          asyncio.run(main())
          PY
