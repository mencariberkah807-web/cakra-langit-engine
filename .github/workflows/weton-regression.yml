name: Weton Regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  weton-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Jawa/Weton regression tests
        env:
          PYTHONPATH: backend
        run: python -m unittest discover -s backend/tests -p 'test_*.py' -v
